<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组块森林 · 样张</title>
<style>
  :root { --paper: #FBF8F1; --ink: #26302B; --body: #5B655F; --moss: #3F6B55; --line: rgba(38, 48, 43, .12); --lift: 0 2px 0 rgba(20, 32, 26, .08), 0 10px 26px rgba(20, 32, 26, .14); --font: Charter, "Songti SC", "Noto Serif CJK SC", Georgia, serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; font: 500 15px/1.5 var(--font); color: var(--ink); }
  body { background: linear-gradient(var(--sky-top, #F1D9B8), var(--sky-low, #F8ECD9) 62%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .card { background: var(--paper); border-radius: 14px; box-shadow: var(--lift); }
  .brand { position: fixed; left: 20px; top: 18px; padding: 10px 18px; line-height: 1.3; }
  .brand strong { display: block; font-size: 20px; letter-spacing: .04em; }
  .brand small { color: var(--body); font-size: 12px; }
  .stats { position: fixed; right: 20px; top: 18px; display: flex; gap: 8px; }
  .stats span { padding: 7px 14px; border-radius: 999px; background: var(--paper); box-shadow: var(--lift); font-size: 13px; color: var(--body); }
  .stats b { color: var(--ink); font-size: 16px; margin: 0 2px; font-variant-numeric: tabular-nums; }
  .switch { position: fixed; right: 20px; top: 66px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .seg { display: flex; padding: 3px; border-radius: 999px; background: var(--paper); box-shadow: var(--lift); }
  .seg a { padding: 5px 13px; border-radius: 999px; color: var(--body); text-decoration: none; font-size: 13px; }
  .seg a.on { background: var(--moss); color: var(--paper); }
  .dock { position: fixed; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; gap: 10px; }
  .go { display: flex; align-items: center; gap: 12px; padding: 11px 22px 11px 12px; border-radius: 999px; background: var(--moss); color: var(--paper); box-shadow: var(--lift); font-size: 16px; }
  .go i { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--paper); color: var(--moss); font-style: normal; font-size: 13px; padding-left: 2px; }
  .go small { opacity: .75; font-size: 12px; margin-left: 4px; }
  .pill { display: flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 999px; background: var(--paper); box-shadow: var(--lift); }
  .pill small { color: var(--body); font-size: 12px; }
  .tag { position: fixed; left: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 5px 13px 5px 5px; border-radius: 999px; background: var(--paper); box-shadow: var(--lift); white-space: nowrap; font-size: 14px; }
  .tag b { display: grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 999px; background: var(--moss); color: var(--paper); font-size: 13px; }
  .tag.gold b { background: #C99A2E; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
<script type="module" src="forest.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<div class="brand card"><strong>组块森林</strong><small id="where"></small></div>
<div class="stats"><span>连续<b>3</b>天</span><span>亮灯<b>4</b>/90</span><span>宝箱<b>3</b>/15</span></div>
<div class="switch">
  <nav class="seg" id="seasons"></nav>
  <nav class="seg" id="times"></nav>
  <nav class="seg" id="weathers"></nav>
</div>
<div id="tags"></div>
<div class="dock">
  <div class="go"><i>▶</i>接着学<small>第 5 课 · The Day Before</small></div>
  <div class="pill">声音<small id="sounds"></small></div>
</div>
</body>
</html>
